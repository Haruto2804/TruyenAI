name: Tự động Viết Truyện Hàng Ngày

on:
  schedule:
    # Chạy vào lúc 01:00 UTC (Tương đương 08:00 sáng giờ Việt Nam) mỗi ngày
    - cron: '0 1 * * *'
  # Cho phép kích hoạt chạy bằng tay từ giao diện GitHub Actions (rất hữu ích khi test)
  workflow_dispatch:
    inputs:
      novel_slug:
        description: 'Slug truyện cần viết (để trống hoặc "all" để viết toàn bộ truyện)'
        required: false
        default: 'all'
      chapters_count:
        description: 'Số chương cần viết cho mỗi truyện'
        required: false
        default: '5'

permissions:
  contents: write # Cấp quyền cho GitHub Actions có thể tự động commit (lưu file mới)

jobs:
  write-story:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Cài đặt Node.js (Cho Sync Engine)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cài đặt Python (Cho Google GenAI SDK)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài đặt thư viện
        run: |
          npm ci
          pip install google-genai

      - name: Chạy Kịch bản Viết truyện (Gemini 3.5 Flash Lite)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          NOVEL_SLUG: ${{ github.event.inputs.novel_slug || 'all' }}
          CHAPTERS_PER_NOVEL: ${{ github.event.inputs.chapters_count || '5' }}
          GCE_METADATA_TIMEOUT: "1"
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/auto_writer.py

      - name: Kích hoạt Lệnh Đồng bộ (Sync Engine)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: npm run sync:novel
        continue-on-error: true # Không làm dừng workflow nếu chưa cấu hình DATABASE_URL trên GitHub Secret

      - name: Lưu và Đẩy code lên GitHub (Commit & Push)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated 5 daily chapters per novel by Gemini 3.5 Flash Lite"
          branch: master
